<html>

  <title>Floating Button</title>
  <link rel="stylesheet" href="button-style.css">
</head>
<body>
  <div id="button" class="button" draggable="false">
    <div class="button__track">
      <div class="button__lines">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  <script src="button-renderer.js"></script>

</html>
